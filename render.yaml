# Render Blueprint — deploys both backend (web service) and frontend (static site).
# Push this repo to GitHub, then in Render: New -> Blueprint -> connect the repo.
services:
  - type: web
    name: farm-market-backend
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: TWO_FACTOR_API_KEY
        sync: false
      - key: TWO_FACTOR_BASE_URL
        value: https://2factor.in/API/V1
      - key: CLIENT_URL
        sync: false

  - type: web
    name: farm-market-frontend
    runtime: static
    rootDir: frontend
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
